
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Feedback</title>
     <link rel="stylesheet" href="style.css">

</head>
<body>

    <header>
        <h1>Submit Feedback</h1>
        <p>We would love to hear your thoughts.</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="profile.html">My Profile</a></li>
            <li><a href="courses.html">My Courses</a></li>
            <li><a href="feedback.html">Feedback</a></li>
            <li><a href="grades.html">My Grades</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <main>
        <h2>Feedback Form</h2>

        <form action="#" method="post">

            <p>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name" required>
            </p>

            <p>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
            </p>

            <p>How would you rate this website?</p>

            <input type="radio" id="excellent" name="rating"
                   value="Excellent" required>
            <label for="excellent">Excellent</label>

            <input type="radio" id="good" name="rating" value="Good">
            <label for="good">Good</label>

            <input type="radio" id="average" name="rating" value="Average">
            <label for="average">Average</label>

            <p>
                <label for="type">Feedback Type:</label>

                <select id="type" name="type">
                    <option value="">Select a type</option>
                    <option value="suggestion">Suggestion</option>
                    <option value="compliment">Compliment</option>
                    <option value="problem">Report a Problem</option>
                </select>
            </p>

            <p>Which pages did you visit?</p>

            <input type="checkbox" id="home" name="pages" value="Home">
            <label for="home">Home</label>

            <input type="checkbox" id="profile" name="pages" value="Profile">
            <label for="profile">Profile</label>

            <input type="checkbox" id="courses" name="pages" value="Courses">
            <label for="courses">Courses</label>

            <p>
                <label for="message">Your Feedback:</label>
            </p>

            <textarea id="message" name="message"
                      rows="6" cols="40"
                      placeholder="Write your feedback here..."
                      required></textarea>

            <p>
                <button type="submit">Submit Feedback</button>
                <button type="reset">Reset Form</button>
            </p>

        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Student Portal</p>
    </footer>

</body>
</html>
